<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Template for activity cards — scripts can clone this and fill in data -->
          <template id="activity-template">
            <article class="activity-card" role="article" aria-label="Activity">
              <h4 class="activity-name">Activity name</h4>
              <p class="activity-desc">Short description</p>
              <p class="activity-schedule"><strong>Schedule:</strong> <span></span></p>

              <!-- Participants section -->
              <div class="participants" aria-live="polite">
                <div class="participants-header">
                  <h5 class="participants-title">Participants</h5>
                  <span class="participants-count" aria-hidden="true">0</span>
                </div>
                <ul class="participants-list">
                  <!-- Filled with <li class="participant-item">email@domain</li> -->
                </ul>
              </div>

              <div class="activity-actions">
                <button class="signup-btn" type="button">Sign Up</button>
              </div>
            </article>
          </template>

          <p class="info">Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
